<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><link rel="manifest" href="manifest.json"><title>Astra v3.1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f4f7fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:620px;margin:auto;padding:18px 14px 90px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:25px;font-weight:800}.pill{font-size:11px;background:#17201b;color:#77e6a8;padding:7px 10px;border-radius:20px}.card{background:#111520;border:1px solid #202636;border-radius:18px;padding:16px;margin:12px 0}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button{border:1px solid #252c3b;background:#111520;color:#aeb7c8;padding:9px 12px;border-radius:11px}.tabs button.active{background:#eef1f5;color:#090b12}.label,.muted{color:#8e98ab;font-size:12px}.price{font-size:30px;font-weight:800;margin-top:4px}.green{color:#73e2a4}.red{color:#ff7785}.signal{padding:8px 11px;border-radius:10px;font-weight:800;font-size:12px}.buy{background:#123722;color:#7df0aa}.sell{background:#3a1820;color:#ff8b98}.hold{background:#2b2818;color:#f3d77b}.chart{width:100%;height:230px;background:#0b0e16;border-radius:12px;margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metric{background:#0b0e16;padding:11px;border-radius:12px}.metric b{display:block;margin-top:4px}.analysis{color:#cbd2df;line-height:1.5;font-size:14px}.button{width:100%;border:0;border-radius:13px;padding:13px;background:#f0f2f6;color:#090b12;font-weight:800;margin-top:10px}.trade{padding:12px 0;border-bottom:1px solid #202636}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e15ee;border-top:1px solid #202636;display:flex;justify-content:center;gap:6px;padding:9px}.nav button{background:transparent;border:0;color:#8e98ab;padding:10px 15px}.nav button.active{color:#fff;background:#171c28;border-radius:11px}</style></head>
<body><div class="app"><div class="top"><div class="logo">✦ Astra</div><div class="pill">PAPER MODE</div></div><div id="screen"></div></div>
<div class="nav"><button onclick="page('home',this)" class="active">Astra</button><button onclick="page('portfolio',this)">Portfolio</button><button onclick="page('alerts',this)">Alerts</button><button onclick="page('settings',this)">Settings</button></div>
<script>
const coins={BTCUSDT:{name:'Bitcoin',symbol:'BTC',dec:0},ETHUSDT:{name:'Ethereum',symbol:'ETH',dec:2},SOLUSDT:{name:'Solana',symbol:'SOL',dec:2}};
let selected='BTCUSDT',balance=Number(localStorage.getItem('astra_balance')||100),trades=JSON.parse(localStorage.getItem('astra_trades')||'[]'),lastSignal='HOLD',lastPrice=0;
function fmt(n,d=2){return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function save(){localStorage.setItem('astra_balance',balance);localStorage.setItem('astra_trades',JSON.stringify(trades))}
async function fetchKlines(symbol){let r=await fetch('https://api.binance.com/api/v3/klines?symbol='+symbol+'&interval=1h&limit=80');if(!r.ok)throw Error();return r.json()}
function analyze(k){let c=k.map(x=>+x[4]),s=n=>c.slice(-n).reduce((a,b)=>a+b,0)/n,fast=s(9),slow=s(21),r=c.slice(-15),g=0,l=0;for(let i=1;i<r.length;i++){let d=r[i]-r[i-1];d>0?g+=d:l-=d}let rs=l?g/l:99,rsi=100-100/(1+rs),score=(fast>slow?1:-1)+(rsi<35?1:0)+(rsi>70?-1:0);let signal=score>=1?'BUY':score<=-1?'SELL':'HOLD',avg=r.reduce((a,b)=>a+b,0)/r.length,sd=Math.sqrt(r.reduce((a,b)=>a+(b-avg)**2,0)/r.length);return{c,fast,slow,rsi,signal,vol:sd/avg*100}}
function draw(k){let c=document.getElementById('chart');if(!c)return;let x=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;x.scale(d,d);let v=k.map(q=>+q[4]),mn=Math.min(...v),mx=Math.max(...v);x.strokeStyle='#252c3b';for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,i*h/5);x.lineTo(w,i*h/5);x.stroke()}x.strokeStyle='#76e6a8';x.lineWidth=2;x.beginPath();v.forEach((p,i)=>{let xx=12+i*(w-24)/(v.length-1),yy=h-12-(p-mn)/(mx-mn||1)*(h-24);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()}
async function load(){let c=coins[selected];document.getElementById('screen').innerHTML='<div class="tabs">'+Object.keys(coins).map(s=>'<button class="'+(s===selected?'active':'')+'" onclick="selectCoin(\''+s+'\')">'+coins[s].symbol+'</button>').join('')+'</div><div class="card"><div class="row"><div><div class="label">'+c.name+' / USDT</div><div id="price" class="price">Loading...</div><div id="move" class="muted">Loading...</div></div><span id="signal" class="signal hold">HOLD</span></div><canvas id="chart" class="chart"></canvas><div id="metrics" class="metrics"></div></div><div class="card"><div class="row"><b>Astra analysis</b><span class="muted">v3.1 engine</span></div><p id="analysis" class="analysis">Analyzing...</p><button class="button" onclick="paperTrade()">Simulate paper trade</button></div>';
try{let k=await fetchKlines(selected),a=analyze(k),p=a.c.at(-1),pct=(p/a.c.at(-2)-1)*100;lastPrice=p;lastSignal=a.signal;document.getElementById('price').textContent=fmt(p,c.dec);document.getElementById('move').textContent=(pct>=0?'+':'')+pct.toFixed(2)+'% last hour';document.getElementById('move').className=pct>=0?'green':'red';document.getElementById('signal').textContent=a.signal;document.getElementById('signal').className='signal '+a.signal.toLowerCase();document.getElementById('metrics').innerHTML='<div class="metric"><span class="label">RSI</span><b>'+a.rsi.toFixed(1)+'</b></div><div class="metric"><span class="label">Fast MA</span><b>'+fmt(a.fast,c.dec)+'</b></div><div class="metric"><span class="label">Volatility</span><b>'+a.vol.toFixed(2)+'%</b></div>';document.getElementById('analysis').textContent=(a.signal==='BUY'?'Momentum is positive. ':a.signal==='SELL'?'Momentum is weakening. ':'Signals are mixed. ')+'The demo engine combines moving averages, RSI and recent volatility. This is not financial advice.';draw(k)}catch(e){analysis.textContent='Market data is temporarily unavailable. Refresh and try again.'}}
function selectCoin(s){selected=s;load()}
function paperTrade(){trades.unshift({time:new Date().toISOString(),coin:coins[selected].symbol,price:lastPrice,signal:lastSignal,pnl:0});trades=trades.slice(0,50);save();const btn=document.querySelector('.button');if(btn){const old=btn.textContent;btn.textContent='✓ Paper trade recorded';setTimeout(()=>btn.textContent=old,1800)}}
function portfolio(){document.getElementById('screen').innerHTML='<div class="card"><div class="label">Paper equity</div><div class="price">'+fmt(balance)+'</div><div class="muted">Real exchange trading is disabled.</div></div><div class="card"><b>Trade history</b>'+(trades.length?trades.map(t=>'<div class="trade"><div class="row"><b>'+t.coin+' · '+t.signal+'</b><span class="muted">'+new Date(t.time).toLocaleString()+'</span></div><div class="muted">'+fmt(t.price)+' · P/L '+fmt(t.pnl)+'</div></div>').join(''):'<p class="muted">No paper trades yet.</p>')+'</div>'}
async function alerts(){document.getElementById('screen').innerHTML='<div class="card"><b>Phone alerts</b><p class="analysis">Enable supported browser notifications. True background push alerts require a server-side push service.</p><button class="button" onclick="enableAlerts()">Enable notifications</button></div>'}
async function enableAlerts(){if(!('Notification'in window)){alert('Notifications are not supported here.');return}let p=await Notification.requestPermission();if(p==='granted'){let r=await navigator.serviceWorker.ready;r.showNotification('Astra alerts enabled',{body:'Astra notifications are enabled.'})}else alert('Permission was not granted.')}
function settings(){document.getElementById('screen').innerHTML='<div class="card"><b>Risk controls</b><div class="trade">Risk per trade <b>1%</b></div><div class="trade">Daily loss limit <b>3%</b></div><div class="trade">Leverage <b>0×</b></div><div class="trade">Mode <b>PAPER</b></div></div><div class="card"><b>Data</b><p class="muted">BTC, ETH and SOL use public market data. No exchange credentials are stored.</p></div>'}
function page(p,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');p==='home'?load():p==='portfolio'?portfolio():p==='alerts'?alerts():settings()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();setInterval(()=>{if(document.querySelector('.nav button.active')?.textContent==='Astra')load()},60000);
</script></body></html>
