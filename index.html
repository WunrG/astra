<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><title>Astra v2</title>
<style>body{background:#090b12;color:white;font-family:system-ui;margin:0;padding:16px}.card{background:#111520;border-radius:16px;padding:16px;margin:12px 0}.price{font-size:34px;font-weight:bold}.green{color:#73e2a4}.muted{color:#9aa3b2}button{padding:12px;border-radius:10px;border:0}</style>
</head><body><h1>✦ Astra v2</h1>
<div class='card'><div class='muted'>BTC / USD</div><div id='price' class='price'>Loading...</div><div id='change' class='green'></div></div>
<div class='card'><div class='muted'>Paper balance</div><div id='bal' class='price'>$100.00</div><button onclick='trade()'>Simulate +$0.25 trade</button></div>
<div class='card'><b>Astra signal:</b> BUY (demo)</div>
<script>
let balance=100;
async function loadPrice(){
try{
const r=await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot');
const j=await r.json();
const p=parseFloat(j.data.amount);
document.getElementById('price').innerText='$'+p.toLocaleString();
document.getElementById('change').innerText='Live BTC spot price';
}catch(e){document.getElementById('price').innerText='Price unavailable';}}
function trade(){balance+=0.25;document.getElementById('bal').innerText='$'+balance.toFixed(2);}
loadPrice();setInterval(loadPrice,60000);
</script></body></html>
