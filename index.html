<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<link rel="manifest" href="manifest.json">
<title>Astra</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f7fb;font-family:Inter,system-ui,-apple-system,sans-serif}
.app{max-width:520px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:25px;font-weight:800;letter-spacing:.4px}.status{font-size:12px;color:#73e2a4;background:#11251b;padding:7px 10px;border-radius:20px}
.card{background:#111520;border:1px solid #202636;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 8px 30px #0003}
.label{font-size:12px;color:#8e98ab}.balance{font-size:31px;font-weight:800;margin-top:4px}.change{color:#73e2a4;font-size:13px;margin-top:3px}
.row{display:flex;justify-content:space-between;align-items:center}.coin{font-weight:750;font-size:18px}.price{font-size:24px;font-weight:800}
.signal{display:inline-block;padding:7px 12px;border-radius:10px;background:#123722;color:#7df0aa;font-weight:800;font-size:12px}
canvas{width:100%;height:170px;margin-top:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#0b0e16;padding:12px;border-radius:12px}.metric b{display:block;margin-top:4px}
.analysis{line-height:1.45;color:#cbd2df;font-size:14px}.button{width:100%;border:0;border-radius:13px;padding:14px;background:#f2f4f8;color:#090b12;font-weight:800;font-size:15px;margin-top:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e15ee;backdrop-filter:blur(12px);border-top:1px solid #202636;padding:10px;display:flex;justify-content:center;gap:8px}
.nav button{background:transparent;border:0;color:#8993a6;padding:10px 18px;border-radius:12px}.nav button.active{background:#171c28;color:#fff}
.small{font-size:12px;color:#747e91}.setting{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #202636}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">✦ Astra</div><div class="status">PAPER MODE</div></div>
<div id="screen"></div>
</div>
<div class="nav">
<button class="active" onclick="show('home',this)">Astra</button>
<button onclick="show('portfolio',this)">Portfolio</button>
<button onclick="show('settings',this)">Settings</button>
</div>
<script>
let balance=100, price=103842, signal='BUY';
function chart(){
 const c=document.getElementById('chart'),x=c.getContext('2d'),w=c.width=c.clientWidth*2,h=c.height=340;x.scale(2,2);
 x.clearRect(0,0,w,h);x.strokeStyle='#334056';x.lineWidth=1;
 for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,i*68);x.lineTo(w/2,i*68);x.stroke()}
 x.strokeStyle='#77e6a8';x.lineWidth=3;x.beginPath();
 for(let i=0;i<70;i++){let xx=i*(w/2)/69, yy=250-i*1.7-Math.sin(i*.45)*18-(i>42?(i-42)*1.2:0);if(i===0)x.moveTo(xx,yy);else x.lineTo(xx,yy)}x.stroke();
}
function home(){return `<div class="card"><div class="label">Paper portfolio</div><div class="balance">$${balance.toFixed(2)}</div><div class="change">+0.00% today</div></div>
<div class="card"><div class="row"><div><div class="coin">BTC / USDT</div><div class="label">Bitcoin</div></div><div class="signal">${signal}</div></div><div style="margin-top:16px"><span class="price">$${price.toLocaleString()}</span></div><canvas id="chart"></canvas>
<div class="metrics"><div class="metric"><span class="label">RSI</span><b>54.2</b></div><div class="metric"><span class="label">EMA 20</span><b>$103,210</b></div><div class="metric"><span class="label">Risk</span><b>1%</b></div></div></div>
<div class="card"><div class="row"><b>Astra analysis</b><span class="small">Demo signal</span></div><p class="analysis">Momentum is mildly positive in this demo. Astra would wait for confirmation before increasing exposure. This screen is paper trading only.</p><button class="button" onclick="trade()">Simulate paper trade</button></div>`}
function portfolio(){return `<div class="card"><div class="label">Total equity</div><div class="balance">$${balance.toFixed(2)}</div><p class="small">No real positions. Trades here are simulated.</p></div><div class="card"><b>Trade history</b><p class="small">No trades yet.</p></div>`}
function settings(){return `<div class="card"><b>Risk controls</b><div class="setting"><span>Risk per trade</span><b>1%</b></div><div class="setting"><span>Daily loss limit</span><b>3%</b></div><div class="setting"><span>Leverage</span><b>0×</b></div><div class="setting"><span>Trading mode</span><b>PAPER</b></div></div><div class="card"><b>Important</b><p class="small">Live exchange trading is not connected. Never enter exchange API keys into this demo.</p></div>`}
function show(s,el){document.getElementById('screen').innerHTML=s==='home'?home():s==='portfolio'?portfolio():settings();document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));el?.classList.add('active');if(s==='home')chart()}
function trade(){balance+=0.25;show('home',document.querySelector('.nav button'))}
show('home',document.querySelector('.nav button'));
</script>
</body></html>
